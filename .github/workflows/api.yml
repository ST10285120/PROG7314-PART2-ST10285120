name: API tests

on:
  push:
    branches: [main]
    paths: ['fitquest-api/**', '.github/workflows/api.yml']
  pull_request:
    branches: [main]
    paths: ['fitquest-api/**', '.github/workflows/api.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitquest-api

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fitquest-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest with coverage
        run: npm test
        env:
          JWT_SECRET: ci-test-secret
          GOOGLE_CLIENT_ID: dummy-client-id-for-ci

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: fitquest-api/coverage/
